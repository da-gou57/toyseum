<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="description" content="玩具收藏品管理：館藏、典藏編號、徵集清單與預購追蹤。資料只存在你的手機。">
<title>Toyseum</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<style>
:root {
  --bg: #f5f0e6;
  --surface: #fffdf8;
  --surface-2: #ebe4d6;
  --line: #ddd3c1;
  --text: #1d2233;
  --muted: #6f6a5f;
  --accent: #1f2a44;
  --accent-ink: #ffffff;
  --accent-soft: #dfe3ee;
  --gold: #e8b33a;
  --gold-ink: #1f2a44;
  --gold-soft: #f7e8c2;
  --warn: #a8660c;
  --warn-soft: #f7e7cd;
  --danger: #c2372a;
  --danger-soft: #f6dcd8;
  --info: #2f5fa8;
  --info-soft: #dde6f5;
  --ok: #2e7d5b;
  --ok-soft: #dcefe4;
  --shadow: 0 1px 2px rgba(31, 42, 68, .06), 0 4px 14px rgba(31, 42, 68, .07);
  --radius: 14px;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151e;
    --surface: #1a2030;
    --surface-2: #252c3e;
    --line: #313a50;
    --text: #ece9e1;
    --muted: #a3a2a0;
    --accent: #e8b33a;
    --accent-ink: #1f2a44;
    --accent-soft: #3a3322;
    --gold: #e8b33a;
    --gold-ink: #1f2a44;
    --gold-soft: #3a3322;
    --warn: #e0a24e;
    --warn-soft: #3a2f1c;
    --danger: #ec7d72;
    --danger-soft: #3d2320;
    --info: #8fb2e3;
    --info-soft: #1f2a3a;
    --ok: #74c49d;
    --ok-soft: #1d3329;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
  overscroll-behavior-y: contain;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; line-height: 1.3; }
a { color: var(--info); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  padding: 14px 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.topbar h1 { font-size: 22px; font-weight: 800; letter-spacing: .02em; }
.topbar .sub { color: var(--muted); font-size: 13px; }
.topbar .acts { display: flex; gap: 6px; }
main { padding: 0 16px; max-width: 640px; margin: 0 auto; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: var(--surface);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
}
.tabbar button {
  border: 0; background: none; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); font-size: 12px;
}
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button.active { color: var(--text); font-weight: 700; }
.tabbar button.active svg { color: var(--accent); }
.tabbar .fab {
  width: 58px; height: 58px; border-radius: 50%; margin: -22px auto 0;
  background: var(--gold); color: var(--gold-ink);
  box-shadow: 0 6px 16px rgba(31, 42, 68, .3);
  display: flex; align-items: center; justify-content: center;
}
.tabbar .fab svg { width: 30px; height: 30px; }

/* ---------- generic ---------- */
.card {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px; margin: 0 0 12px;
}
.section-title {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 15px; font-weight: 700; margin: 18px 2px 8px;
}
.section-title .count { color: var(--muted); font-weight: 500; font-size: 13px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.spacer { height: 8px; }
.hr { height: 1px; background: var(--line); margin: 12px 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 12px; padding: 10px 14px; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 600; font-size: 15px;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 20px; height: 20px; flex: none; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.ghost { border-color: transparent; background: transparent; }
.icon-btn.on { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }

.big-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 6px; }
.big-actions .btn { min-height: 68px; font-size: 16px; flex-direction: column; gap: 4px; border-radius: 16px; }
.big-actions .btn svg { width: 26px; height: 26px; }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted); white-space: nowrap;
}
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.gold { background: var(--gold-soft); color: var(--warn); }
.code {
  display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .04em;
  padding: 1px 7px; border-radius: 6px; background: #1f2a44; color: #e8b33a;
  font-variant-numeric: tabular-nums; white-space: nowrap; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.code.lg { font-size: 15px; padding: 3px 10px; border-radius: 8px; }

.banner {
  border-radius: var(--radius); padding: 12px 14px; margin: 4px 0 12px;
  display: flex; gap: 10px; align-items: center;
  background: var(--warn-soft); color: var(--text);
}
.banner svg { width: 22px; height: 22px; color: var(--warn); flex: none; }
.banner.info { background: var(--info-soft); }
.banner.info svg { color: var(--info); }
.banner.gold { background: var(--gold-soft); }

/* ---------- item list ---------- */
.list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
.item {
  display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 14px;
  border-bottom: 1px solid var(--line); min-height: 60px;
}
.item:last-child { border-bottom: 0; }
.item .main { flex: 1; min-width: 0; }
.item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.item .qty { font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .qty small { display: block; color: var(--muted); font-weight: 500; font-size: 11px; }
.item.tap:active { background: var(--surface-2); }
.item.dim { opacity: .6; }

details.group { margin-bottom: 10px; }
details.group > summary {
  list-style: none; display: flex; align-items: center; gap: 8px;
  padding: 10px 4px; font-weight: 700; font-size: 15px;
}
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary .chev { transition: transform .2s; width: 18px; height: 18px; color: var(--muted); flex: none; }
details.group[open] > summary .chev { transform: rotate(90deg); }
details.group > summary .count { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: auto; white-space: nowrap; }
.sub-group-title { font-size: 13px; color: var(--muted); font-weight: 600; padding: 8px 14px 4px; background: var(--surface-2); }

.empty { text-align: center; color: var(--muted); padding: 28px 16px; }
.empty svg { width: 44px; height: 44px; opacity: .6; margin-bottom: 6px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 4px; font-weight: 600; color: var(--muted); min-height: 38px; font-size: 14px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.search {
  display: flex; align-items: center; gap: 8px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; height: 46px; margin: 10px 0;
}
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search input { border: 0; outline: 0; background: transparent; flex: 1; height: 100%; font-size: 16px; min-width: 0; }
.filterbar { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; margin: -2px 0 2px; -webkit-overflow-scrolling: touch; }
.filterbar button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; min-height: 34px; display: inline-flex; align-items: center; gap: 4px; }
.filterbar button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.filterbar button svg { width: 16px; height: 16px; }

/* ---------- forms ---------- */
.field { margin-bottom: 14px; }
.field > label, .field > .label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.input, select.input, textarea.input {
  width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); padding: 10px 12px; font-size: 16px; outline: none;
}
textarea.input { min-height: 72px; resize: vertical; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.ai-mark { font-size: 11px; font-weight: 700; color: var(--info); background: var(--info-soft); border-radius: 6px; padding: 0 6px; margin-left: 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stepper { display: flex; align-items: stretch; gap: 8px; }
.stepper .icon-btn { width: 46px; height: 46px; }
.stepper input { text-align: center; font-weight: 700; font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.chips button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-size: 14px; min-height: 36px;
}
.chips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.switch-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.switch-row:last-child { border-bottom: 0; }
.switch-row .grow > div:first-child { font-weight: 600; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: .2s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }

/* ---------- settings list ---------- */
.setting-row {
  display: flex; align-items: center; gap: 12px; padding: 14px; border-bottom: 1px solid var(--line);
  background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; min-height: 56px;
}
.setting-row:last-child { border-bottom: 0; }
.setting-row svg.lead { width: 22px; height: 22px; color: var(--accent); flex: none; }
.setting-row .chev { width: 18px; height: 18px; color: var(--muted); flex: none; }
.setting-row .val { color: var(--muted); font-size: 14px; white-space: nowrap; }
.setting-row.card-like { border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); margin-bottom: 10px; border: 0; }
.edit-row { display: flex; align-items: center; gap: 6px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line); min-height: 54px; }
.edit-row:last-child { border-bottom: 0; }
.edit-row .icon-btn { width: 36px; height: 36px; border-color: transparent; background: transparent; color: var(--muted); }
.edit-row .icon-btn[disabled] { opacity: .3; }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; }
.overlay .backdrop { position: absolute; inset: 0; background: rgba(10, 14, 25, .5); opacity: 0; transition: opacity .2s; }
.overlay.open .backdrop { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh;
  background: var(--bg); border-radius: 20px 20px 0 0;
  transform: translateY(100%); transition: transform .24s cubic-bezier(.2, .8, .2, 1);
  display: flex; flex-direction: column; max-width: 640px; margin: 0 auto;
}
.overlay.open .sheet { transform: translateY(0); }
.sheet.full { height: 92vh; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 18px; }
.sheet-head h2 { font-size: 18px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }
.sheet-body { padding: 4px 16px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }
.sheet-foot { padding: 10px 16px calc(12px + var(--safe-b)); display: flex; gap: 10px; border-top: 1px solid var(--line); background: var(--bg); }
.sheet-foot .btn { flex: 1; }

/* camera */
.cam { position: fixed; inset: 0; z-index: 200; background: #000; color: #fff; display: flex; flex-direction: column; }
.cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cam .cam-top, .cam .cam-bottom { position: relative; z-index: 2; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.cam .cam-top { padding-top: calc(12px + env(safe-area-inset-top, 0px)); background: linear-gradient(rgba(0,0,0,.6), transparent); }
.cam .cam-bottom { margin-top: auto; flex-direction: column; align-items: stretch; padding-bottom: calc(18px + var(--safe-b)); background: linear-gradient(transparent, rgba(0,0,0,.75)); }
.cam .icon-btn { background: rgba(0,0,0,.4); border-color: rgba(255,255,255,.25); color: #fff; }
.cam .icon-btn.on { background: #fff; color: #000; }
.cam .frame {
  position: absolute; z-index: 1; left: 50%; top: 42%; transform: translate(-50%, -50%);
  width: min(78vw, 360px); height: min(48vw, 220px); border-radius: 18px;
  box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.9);
}
.cam .frame .laser { position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: #e8b33a; box-shadow: 0 0 10px #e8b33a; animation: laser 1.8s ease-in-out infinite; }
@keyframes laser { 0%, 100% { transform: translateY(-60px); opacity: .4; } 50% { transform: translateY(60px); opacity: 1; } }
.cam .cam-msg { text-align: center; font-size: 15px; text-shadow: 0 1px 4px rgba(0,0,0,.8); min-height: 24px; }
.cam .seg { background: rgba(255,255,255,.15); }
.cam .seg button { color: rgba(255,255,255,.8); }
.cam .seg button.on { background: #fff; color: #000; }
.cam .shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,.25); margin: 6px auto 0; }
.cam .shutter:active { background: rgba(255,255,255,.6); }
.cam .btn { background: rgba(255,255,255,.95); color: #111; border: 0; }
.cam .btn.ghost { background: rgba(0,0,0,.35); color: #fff; }
.cam .ghost-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .3; pointer-events: none; z-index: 1; }

/* toast */
#toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 14px);
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 300;
  background: #1f2a44; color: #fff; border-radius: 12px; padding: 10px 14px;
  display: flex; align-items: center; gap: 12px; font-size: 15px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  transition: .22s; max-width: calc(100vw - 32px); width: max-content;
}
#toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
#toast span { flex: 1; }
#toast button { border: 0; background: none; color: #e8b33a; font-weight: 700; padding: 4px 2px; white-space: nowrap; }

/* stats */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; font-weight: 600; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row .top { display: flex; gap: 8px; font-size: 14px; }
.bar-row .top .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .top .v { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.copy { padding: 10px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; align-items: flex-start; }
.copy:last-child { border-bottom: 0; }
.kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; font-size: 14px; }
.kv .k { color: var(--muted); }
.greet { margin: 2px 2px 12px; font-size: 15px; color: var(--muted); }
.greet b { color: var(--text); }

/* onboarding */
.onb { text-align: center; padding: 8px 4px 4px; }
.onb .ill { width: 96px; height: 96px; border-radius: 28px; background: var(--gold-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 8px auto 14px; overflow: hidden; }
.onb .ill svg { width: 52px; height: 52px; }
.onb .ill img { width: 100%; height: 100%; }
.onb h3 { font-size: 20px; margin-bottom: 8px; }
.onb p { color: var(--muted); margin: 0 0 6px; text-align: left; }
.dots { display: flex; justify-content: center; gap: 6px; margin: 16px 0 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 20px; border-radius: 4px; }

.check { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: transparent; flex: none; display: inline-flex; align-items: center; justify-content: center; color: transparent; padding: 0; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check svg { width: 16px; height: 16px; }
.row > svg, .card > svg { width: 22px; height: 22px; flex: none; color: var(--accent); }

/* photos */
.thumb { width: 48px; height: 48px; border-radius: 10px; flex: none; overflow: hidden; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 700; font-size: 17px; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.lg { width: 64px; height: 64px; border-radius: 12px; }
.thumb svg { width: 22px; height: 22px; }

const ic = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const pad4 = n => String(n).padStart(4, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
function isoParts(s) { const [y, m, d] = s.split('-').map(Number); return [y, m - 1, d]; }
const daysBetween = (a, b) => Math.round((Date.UTC(...isoParts(b)) - Date.UTC(...isoParts(a))) / 86400000);
const fmtDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${y}/${+m}/${+d}`; };
const fmtDateShort = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return (y == new Date().getFullYear() ? '' : `${y}/`) + `${+m}/${+d}`; };
const numOrNull = v => { v = String(v ?? '').replace(/[,\s]/g, ''); if (v === '') return null; const n = +v; return isFinite(n) && n >= 0 ? Math.round(n) : null; };
const fmtNum = n => Math.round(n).toLocaleString('en-US');
function money(n, { force = false } = {}) {
  if (n == null || n === '') return '';
  if (S?.settings.guest && !force) return 'NT$ •••';
  return `NT$ ${fmtNum(n)}`;
}
function relDay(n) {
  if (n === 0) return '今天';
  if (n === 1) return '明天';
  if (n === -1) return '昨天';
  if (n < 0) return `${-n} 天前`;
  if (n < 60) return `${n} 天後`;
  return `${Math.round(n / 30)} 個月後`;
}
function moveIn(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }
function normName(s) { return String(s || '').toLowerCase().normalize('NFKC').replace(/[\s\-_.,，、。:：!！?？()（）\[\]【】「」『』'"/・·]+/g, ''); }
function similar(a, b) {
  a = normName(a); b = normName(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  if (a.length >= 3 && b.length >= 3 && (a.includes(b) || b.includes(a))) return .85;
  const grams = s => { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); } return m; };
  const A = grams(a), B = grams(b); let inter = 0, tot = 0;
  for (const [g, n] of A) { inter += Math.min(n, B.get(g) || 0); tot += n; }
  for (const n of B.values()) tot += n;
  return tot ? 2 * inter / tot : 0;
}

/* ---------- storage ---------- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('toyseum', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  },
  async del(k) {
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  },
  async keys() {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('kv').objectStore('kv').getAllKeys(); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); });
  },
};
const Photos = {
  cache: new Map(),
  async get(id) {
    if (!id) return null;
    if (this.cache.has(id)) return this.cache.get(id);
    const v = await IDB.get('photo:' + id).catch(() => null);
    if (v) this.cache.set(id, v);
    return v || null;
  },
  async put(id, data) { await IDB.set('photo:' + id, data); this.cache.set(id, data); },
  async del(id) { await IDB.del('photo:' + id).catch(() => {}); this.cache.delete(id); },
  async all() {
    const out = {};
    for (const k of await IDB.keys()) if (String(k).startsWith('photo:')) out[k.slice(6)] = await IDB.get(k);
    return out;
  },
  async clear() { for (const k of await IDB.keys()) if (/^(photo|src):/.test(String(k))) await IDB.del(k); this.cache.clear(); },
};
// 等待 AI 辨識的原始照片（較高解析度），辨識完就刪除
const SrcImgs = {
  put: (id, data) => IDB.set('src:' + id, data),

const W_OTH = 'w_oth';

/* ---------- lookups ---------- */
const byId = (arr, id) => arr.find(x => x.id === id);
const workById = id => byId(S.works, id) || byId(S.works, W_OTH);
const seriesById = id => byId(S.series, id);

const placeLabel = id => { const p = placeOf(id); return p ? `${p.kind === 'storage' ? L('storage') : L('display')}・${p.name}` : '未指定'; };

const itemCode = it => `${workById(it.workId).code}-${pad4(it.no)}`;
const copyCode = (it, c) => `${itemCode(it)}-${c.n}`;
const itemSpend = it => it.copies.reduce((s, c) => s + (c.price || 0), 0);
const itemValue = it => it.estValue != null ? it.estValue * it.copies.length : itemSpend(it);
const itemsByBarcode = code => S.items.filter(it => (it.barcodes || []).includes(code));
const wantsByBarcode = code => S.wants.filter(w => w.status !== 'arrived' && (w.barcodes || []).includes(code));
function seriesLabel(it) {
  const w = workById(it.workId), s = seriesById(it.seriesId);
  return [w.id === W_OTH ? '' : w.zh, s?.name, it.character].filter(Boolean).join('・');
}
function lastCopyAt(it) { return Math.max(it.createdAt || 0, ...it.copies.map(c => c.createdAt || 0)); }

/* ---------- 典藏編號 ---------- */
function gapsIn(used, last) {
  const set = new Set(used); const out = [];
  for (let i = 1; i <= last; i++) if (!set.has(i)) out.push(i);
  return out;
}
const itemGaps = w => gapsIn(S.items.filter(it => it.workId === w.id).map(it => it.no), w.lastNo || 0);
const copyGaps = it => gapsIn(it.copies.map(c => c.n), it.lastN || 0);
function stripAccents(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
// 代號規則：一個單字取前 3 個字母；兩個以上單字取第一字前 2 字母＋第二字首字母
function codeCandidates(en) {
  const words = stripAccents(en).toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ').trim().split(/\s+/).filter(Boolean).map(w => w.replace(/[^A-Z]/g, '')).filter(Boolean);
  if (!words.length) return [];
  const out = [];
  const add = c => { if (c.length === 3 && !out.includes(c)) out.push(c); };
  const w0 = words[0];
  if (words.length === 1) {
    add(w0.slice(0, 3));
    for (let k = 2; k < w0.length; k++) add(w0[0] + w0[1] + w0[k]);
    const cons = w0.slice(1).replace(/[AEIOU]/g, '');
    for (let j = 0; j < cons.length; j++) for (let k = j + 1; k < cons.length; k++) add(w0[0] + cons[j] + cons[k]);
    for (let j = 1; j < w0.length; j++) for (let k = j + 1; k < w0.length; k++) add(w0[0] + w0[j] + w0[k]);
  } else {
    const w1 = words[1];
    add((w0.slice(0, 2) + w1[0]));
    if (words[2]) add(w0[0] + w1[0] + words[2][0]);
    for (let k = 1; k < w1.length; k++) add(w0[0] + w1[0] + w1[k]);
    for (let k = 2; k < w0.length; k++) add(w0[0] + w0[1] + w0[k]);
    for (let k = 1; k < w1.length; k++) add(w0[0] + w0[1] + w1[k]);
  }
  return out;
}
const codeTaken = (code, exceptId) => S.works.some(w => w.code === code && w.id !== exceptId);
function suggestCode(en) { return codeCandidates(en).find(c => !codeTaken(c)) || ''; }
const validCode = c => /^[A-Z]{3}$/.test(c);

/* ---------- undo ---------- */
let undoSnap = null;
function snapshot() { undoSnap = JSON.stringify({ items: S.items, wants: S.wants, works: S.works, series: S.series }); }
function undo() {
  if (!undoSnap) return;
  const u = JSON.parse(undoSnap); undoSnap = null;
  Object.assign(S, u); commit(); toast('已復原');
}
function commit() { save(); renderMain(); refreshOverlays(); }

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, action) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action.label)}</button>` : '');
  if (action) $('button', el).onclick = () => { el.classList.remove('show'); action.fn(); };
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), action ? 5000 : 2600);
}

/* ---------- overlay stack (Android 返回鍵可關閉) ---------- */
const overlays = [];
const backWaiters = [];
function pushOverlay(el, opts = {}) {
  $('#overlays').appendChild(el);
  overlays.push({ el, ...opts });
  history.pushState({ ov: overlays.length }, '');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('open')));
}
function popOverlay() {
  const o = overlays.pop();
  if (!o) return;
  try { o.onClose && o.onClose(); } catch (e) { console.error(e); }
  o.el.classList.remove('open');
  setTimeout(() => o.el.remove(), 240);
}
window.addEventListener('popstate', () => {
  if (overlays.length) popOverlay();
  const w = backWaiters.shift(); w && w();
});
function closeTop() {
  return new Promise(res => {
    if (!overlays.length) return res();
    backWaiters.push(res);
    history.back();
  });
}
async function closeAll() { while (overlays.length) await closeTop(); }
function refreshOverlays() { overlays.forEach(o => { try { o.refresh && o.refresh(); } catch (e) { console.error(e); } }); }
const isOpen = ctx => overlays.some(o => o.el === ctx.el);

function sheet({ title, body, foot, full = false, onMount, refresh, onClose }) {
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `<div class="backdrop"></div>
    <div class="sheet ${full ? 'full' : ''}" role="dialog" aria-label="${esc(title)}">
      <div class="sheet-grip"></div>
      <div class="sheet-head"><h2></h2><button class="icon-btn ghost" data-close aria-label="關閉">${ic('x')}</button></div>
      <div class="sheet-body"></div>
      <div class="sheet-foot" hidden></div>
    </div>`;
  const ctx = {
    el,
    setTitle(t) { $('.sheet-head h2', el).textContent = t; },
    setBody(h) { $('.sheet-body', el).innerHTML = h; },
    setFoot(h) { const f = $('.sheet-foot', el); f.hidden = !h; f.innerHTML = h || ''; },
    $: s => $(s, el), $$: s => $$(s, el),
  };
  ctx.setTitle(title);
  ctx.setBody(body || '');
  ctx.setFoot(foot || '');
  $('.backdrop', el).onclick = () => closeTop();
  $('[data-close]', el).onclick = () => closeTop();
  pushOverlay(el, { refresh: refresh ? () => refresh(ctx) : null, onClose });
  onMount && onMount(ctx);
  return ctx;
}

function confirmDialog(msg, { ok = '確定', danger = false, cancel = '取消', title = '請確認' } = {}) {
  return new Promise(res => {
    let result = false;
    sheet({
      title,
      body: `<p style="margin:4px 0 8px">${msg}</p>`,
      foot: `<button class="btn" data-no>${esc(cancel)}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(ok)}</button>`,
      onMount: ctx => {
        ctx.$('[data-no]').onclick = () => closeTop();
        ctx.$('[data-yes]').onclick = () => { result = true; closeTop(); };
      },
      onClose: () => res(result),
    });
  });
}
// 二次確認：兩個步驟都按確定才算數
async function doubleConfirm(msg1, msg2, { ok = '確定修改' } = {}) {
  if (!await confirmDialog(msg1, { ok: '下一步' })) return false;
  return confirmDialog(msg2, { ok, danger: true, title: '再次確認' });
}
function promptDialog(title, { value = '', placeholder = '', type = 'text', label = '', ok = '確定', hint = '', inputmode = '', upper = false, maxlength = '' } = {}) {
  return new Promise(res => {
    let result = null;
    sheet({
      title,
      body: `<div class="field">${label ? `<label>${esc(label)}</label>` : ''}<input class="input" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${inputmode ? `inputmode="${inputmode}"` : ''} ${maxlength ? `maxlength="${maxlength}"` : ''} ${upper ? 'autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.1em;font-weight:700"' : ''}>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`,
      foot: `<button class="btn" data-no>取消</button><button class="btn primary" data-yes>${esc(ok)}</button>`,
      onMount: ctx => {
        const inp = ctx.$('input');
        setTimeout(() => inp.focus(), 250);
        const done = () => { result = upper ? inp.value.toUpperCase() : inp.value; closeTop(); };
        inp.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) done(); };
        ctx.$('[data-no]').onclick = () => closeTop();
        ctx.$('[data-yes]').onclick = done;
      },
      onClose: () => res(result),
    });
  });
}
// 選項清單（回傳選到的 value，取消回傳 null）
function choiceDialog(title, msg, options) {
  return new Promise(res => {
    let result = null;
    sheet({
      title,
      body: `${msg ? `<p style="margin:4px 0 12px">${msg}</p>` : ''}${options.map((o, i) => `<button class="btn ${o.primary ? 'primary' : ''} block" style="margin-bottom:8px;justify-content:flex-start;text-align:left" data-i="${i}">${o.icon ? ic(o.icon) : ''}<span class="grow">${o.label}${o.sub ? `<div class="small" style="font-weight:500;opacity:.8">${o.sub}</div>` : ''}</span></button>`).join('')}`,
      onMount: ctx => { ctx.$$('[data-i]').forEach(b => b.onclick = () => { result = options[+b.dataset.i].value; closeTop(); }); },
      onClose: () => res(result),
    });
  });
}

/* ---------- items (館藏) ---------- */
function itemMatches(it, q) {
  if (!q) return true;
  const w = workById(it.workId), s = seriesById(it.seriesId);
  const hay = [it.name, w.zh, w.en, w.code, s?.name, it.character, it.brand, it.edition, typeName(it.typeId), itemCode(it), ...(it.barcodes || []), ...(it.tags || []), it.note]
    .filter(Boolean).join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t) || normName(hay).includes(normName(t)));
}
function copyPass(c) {
  const f = UI.f;
  if (f.placeId && (f.placeId === '_none' ? !!placeOf(c.placeId) : c.placeId !== f.placeId)) return false;
  if (f.seal && c.seal !== f.seal) return false;
  return true;
}
function filteredItems() {
  const f = UI.f;
  return S.items.filter(it => itemMatches(it, UI.q.trim()) && (!f.workId || it.workId === f.workId) && (!f.typeId || it.typeId === f.typeId) && it.copies.some(copyPass));
}
const SORTS = { recent: '最近登錄', code: '編號', date: '購買日期', price: '價格', name: '名稱' };
function sortItems(list) {
  const firstDate = it => it.copies.map(c => c.date || '').filter(Boolean).sort()[0] || '';
  const fn = {
    recent: (a, b) => lastCopyAt(b) - lastCopyAt(a),
    code: (a, b) => itemCode(a).localeCompare(itemCode(b)),
    date: (a, b) => (firstDate(b) || '0').localeCompare(firstDate(a) || '0'),
    price: (a, b) => itemSpend(b) - itemSpend(a),
    name: (a, b) => a.name.localeCompare(b.name, 'zh-Hant'),
  }[UI.sort];
  return [...list].sort(fn);
}

  } else if (UI.mode === 'work') {
    const groups = S.works.map(w => ({ w, items: list.filter(it => it.workId === w.id) })).filter(g => g.items.length)
      .sort((a, b) => (a.w.id === W_OTH) - (b.w.id === W_OTH) || a.w.code.localeCompare(b.w.code));
    h = groups.map(g => groupHTML(g.w.id, `<span class="code" style="margin-right:6px">${esc(g.w.code)}</span>${esc(g.w.zh)}`, `${g.items.length} 款・${g.items.reduce((s, it) => s + it.copies.filter(copyPass).length, 0)} 件`,

  } else {

/* ---------- wants (徵集清單) ---------- */
function renderWants(v) {
  setTop(L('wants'), `${S.wants.length} 項`, `${guestBtn()}<button class="icon-btn" data-new aria-label="新增">${ic('plus')}</button>`);
  bindGuestBtn();
  $('#top [data-new]').onclick = () => openWantForm({});
  v.innerHTML = `<label class="search" style="margin-top:2px">${ic('search')}<input type="search" placeholder="搜尋${esc(L('wants'))}" value="${esc(UI.wq)}" data-q></label><div data-res></div>`;
  const qi = $('[data-q]', v);
  const draw = () => {
    const q = UI.wq.trim().toLowerCase();
    const list = S.wants.filter(w => !q || [w.name, workById(w.workId)?.zh, w.character, w.brand, ...(w.barcodes || [])].filter(Boolean).join(' ').toLowerCase().includes(q));
    const by = s => list.filter(w => s.includes(w.status));
    const sortDue = arr => arr.sort((a, b) => (a.eta || a.releaseDate || '9999').localeCompare(b.eta || b.releaseDate || '9999'));
    const sec = (title, arr, note = '') => arr.length ? `<div class="section-title"><span>${title}</span><span class="count">${arr.length} 項</span></div>${note}<div class="list">${arr.map(wantRow).join('')}</div>` : '';
    let h = sec('已到貨，等待' + L('add'), by(['arrived']), `<div class="hint" style="margin:-4px 2px 8px">點進去按「${esc(L('add'))}」，資料會自動帶入。</div>`);
    h += sec(L('transit'), sortDue(by(TRANSIT)));
    h += sec('想要', by(['want']).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
    if (!S.wants.length) h = `<div class="card empty">${ic('heart')}<div><b>${L('wants')}是空的</b></div><div class="small">把想買的玩具、已預購的商品記在這裡，到貨後一鍵${esc(L('add'))}。逛店掃條碼時也會提醒你它在清單上。</div></div>`;
    else if (!list.length) h = `<div class="empty">找不到符合的項目</div>`;
    $('[data-res]', v).innerHTML = h;
    $$('[data-want]', v).forEach(el => el.onclick = () => openWant(el.dataset.want));
  };
  qi.addEventListener('input', e => { if (e.isComposing) return; UI.wq = qi.value; draw(); });
  qi.addEventListener('compositionend', () => { UI.wq = qi.value; draw(); });
  draw();
}

/* ---------- stats (館務年報) ---------- */
function openStats() {
  const render = ctx => {
    const copies = S.items.flatMap(it => it.copies.map(c => ({ it, c })));
    const spend = copies.reduce((s, x) => s + (x.c.price || 0), 0);
    const value = S.items.reduce((s, it) => s + itemValue(it), 0);
    const guest = S.settings.guest;
    const agg = keyFn => {
      const m = new Map();
      for (const x of copies) { const k = keyFn(x); const o = m.get(k) || { n: 0, sum: 0, kinds: new Set() }; o.n++; o.sum += x.c.price || 0; o.kinds.add(x.it.id); m.set(k, o); }
      return [...m.entries()].map(([k, o]) => ({ k, ...o, kinds: o.kinds.size }));
    };
    const bars = (rows, label) => {
      if (!rows.length) return '<div class="small muted">還沒有資料</div>';
      const max = Math.max(...rows.map(r => guest ? r.n : r.sum || r.n), 1);
      return `<div class="bars">${rows.map(r => `<div class="bar-row"><div class="top"><span class="grow">${label(r.k)}</span><span class="v">${r.kinds} 款 ${r.n} 件${!guest && r.sum ? `・${esc(money(r.sum))}` : ''}</span></div><div class="bar"><i style="width:${Math.max(2, ((guest ? r.n : r.sum || r.n) / max) * 100)}%"></i></div></div>`).join('')}</div>`;
    };
    const byWork = agg(x => x.it.workId).sort((a, b) => b.sum - a.sum || b.n - a.n);
    const byType = agg(x => x.it.typeId || '').sort((a, b) => b.sum - a.sum || b.n - a.n);
    const byYear = agg(x => (x.c.date || '').slice(0, 4) || '未填').sort((a, b) => b.k.localeCompare(a.k));
    const byChan = agg(x => x.c.channelId || '').sort((a, b) => b.sum - a.sum || b.n - a.n);
    const seal = agg(x => x.c.seal || 'sealed');
    ctx.setBody(`<div class="stats">
        <div class="stat"><div class="k">${L('items')}</div><div class="v">${S.items.length} <small>款</small> ${copies.length} <small>件</small></div></div>
        <div class="stat"><div class="k">總花費</div><div class="v">${spend ? esc(money(spend)) : '—'}</div></div>
        <div class="stat"><div class="k">估計總值</div><div class="v">${value ? esc(money(value)) : '—'}</div></div>
        <div class="stat"><div class="k">平均每件（有填價格）</div><div class="v">${copies.length && spend ? esc(money(spend / copies.filter(x => x.c.price).length || 0)) : '—'}</div></div>
      </div>
      <div class="hint" style="margin:6px 2px 0">估計總值：有填「目前估價」的用估價計算，沒填的用購買價。${guest ? `目前是${L('guest')}，金額已隱藏。` : ''}</div>
      <div class="small muted" style="margin:8px 2px 0">${Object.entries(SEAL()).map(([k, n]) => `${n} ${seal.find(r => r.k === k)?.n || 0} 件`).join('・')}</div>
      <div class="section-title"><span>依作品</span></div><div class="card">${bars(byWork, k => { const w = workById(k); return `<span class="code" style="margin-right:6px">${esc(w.code)}</span>${esc(w.zh)}`; })}</div>
      <div class="section-title"><span>依年度</span></div><div class="card">${bars(byYear, k => esc(k === '未填' ? '未填購買日期' : `${k} 年`))}</div>
      <div class="section-title"><span>依類型</span></div><div class="card">${bars(byType, k => esc(typeName(k) || '未分類'))}</div>
      <div class="section-title"><span>依購買管道</span></div><div class="card">${bars(byChan, k => esc(chanName(k) || '未填'))}</div>`);
  };
  sheet({ title: L('stats'), full: true, onMount: render, refresh: render });
}

   作品、代號、編號

function sortedWorks() { return [...S.works].sort((a, b) => (a.id === W_OTH) - (b.id === W_OTH) || a.code.localeCompare(b.code)); }

// 新作品：填中英文名 → 依規則產生代號 → 你決定使用或修改
function openWorkCreate({ zh = '', en = '' } = {}) {
  return new Promise(res => {
    let result = null, aiTried = false;
    const ctx = sheet({
      title: '新作品',
      body: `<div class="field"><label>作品中文名</label><input class="input" data-zh value="${esc(zh)}" placeholder="例如：鋼彈"></div>
        <div class="field"><label>英文名（用來產生 3 碼代號）</label><input class="input" data-en value="${esc(en)}" placeholder="例如：Gundam" autocapitalize="words" autocomplete="off">
        <div class="hint" data-st>${aiReady() ? '只知道中文名也可以，按下一步時 AI 會幫你查英文名。' : '不知道英文名可以留空，下一步直接輸入代號。'}</div></div>`,
      foot: `<button class="btn" data-no>取消</button><button class="btn primary" data-next>下一步</button>`,
      onMount: c => {
        setTimeout(() => (zh ? c.$('[data-en]') : c.$('[data-zh]')).focus(), 250);
        c.$('[data-no]').onclick = () => closeTop();
        c.$('[data-next]').onclick = async () => {
          const z = c.$('[data-zh]').value.trim();
          let e = c.$('[data-en]').value.trim();
          if (!z) return toast('請輸入作品中文名');
          const same = S.works.find(w => normName(w.zh) === normName(z));
          if (same) { result = same; toast(`已經有「${same.zh}」（${same.code}）`); return closeTop(); }
          if (!e && aiReady() && !aiTried) {
            aiTried = true;
            const btn = c.$('[data-next]'); btn.disabled = true;
            c.$('[data-st]').innerHTML = '<span class="row small"><span class="spin" style="width:16px;height:16px;border-width:2px"></span>AI 查詢英文名中…</span>';
            try {
              const r = await aiWorkEnglish(z);
              if (r.en) { c.$('[data-en]').value = r.en; e = r.en; c.$('[data-st]').textContent = r.sure ? 'AI 填入的英文名，請確認是否正確。' : 'AI 不太確定，請確認或修改。'; }
              else c.$('[data-st]').textContent = 'AI 查不到英文名，可以自己填，或留空直接輸入代號。';
            } catch (err) { c.$('[data-st]').textContent = `${err.zh || 'AI 失敗'}。可以自己填英文名，或留空直接輸入代號。`; }
            btn.disabled = false;
            if (!e || !isOpen(c)) return;
            return; // 讓你先確認 AI 填的英文名，再按一次下一步
          }
          const code = await askWorkCode(e);
          if (!code) return;
          const w = { id: uid(), zh: z, en: e, code, lastNo: 0, createdAt: Date.now() };
          S.works.push(w); commit();
          result = w;
          await closeTop();
          toast(`已建立作品 ${code}・${z}`);
        };
      },
      onClose: () => res(result),
    });
    void ctx;
  });
}
async function askWorkCode(en, { exceptId = null, current = '' } = {}) {
  const sug = codeCandidates(en).find(c => !codeTaken(c, exceptId)) || '';
  if (sug) {
    const base = codeCandidates(en)[0];
    const note = base && base !== sug ? `照規則是 ${base}，但已經有作品在用，改建議 ` : '依規則建議代號 ';
    const r = await choiceDialog('作品代號', `${note}<span class="code lg">${sug}</span>，要用這個嗎？<div class="hint" style="margin-top:8px">典藏編號會長這樣：${sug}-0001-1</div>`,
      [{ value: 'use', label: `使用 ${sug}`, primary: true, icon: 'check' }, { value: 'edit', label: '修改代號', icon: 'edit' }]);
    if (!r) return null;
    if (r === 'use') return sug;
  }
  let v = current || sug;
  for (;;) {
    const x = await promptDialog('輸入作品代號', { value: v, label: '3 個英文字母', placeholder: '例如 GUN', upper: true, maxlength: 3, hint: '只能用 A–Z，不能和其他作品重複。' });
    if (x == null) return null;
    v = x.trim().toUpperCase();
    if (!validCode(v)) { toast('代號要剛好 3 個英文字母'); continue; }
    if (codeTaken(v, exceptId)) { const o = S.works.find(w => w.code === v); toast(`${v} 已經是「${o.zh}」的代號`); continue; }
    return v;
  }
}
// 款號：有空號時問要不要補
async function chooseNo(w) {
  const next = (w.lastNo || 0) + 1;
  const gaps = itemGaps(w);
  if (!gaps.length) return next;
  const r = await choiceDialog('有空出的編號', `<span class="code lg">${esc(w.code)}-${pad4(gaps[0])}</span> 已空出，要補上嗎？`, [
    { value: gaps[0], label: `補上 ${w.code}-${pad4(gaps[0])}`, primary: true },
    { value: next, label: `用新號 ${w.code}-${pad4(next)}` },
    ...(gaps.length > 1 ? [{ value: 'pick', label: `從 ${gaps.length} 個空號中挑選` }] : []),
  ]);
  if (r !== 'pick') return r;
  return choiceDialog('選擇空號', '', gaps.map(g => ({ value: g, label: `${w.code}-${pad4(g)}` })));
}
async function chooseCopyN(it) {
  const next = (it.lastN || 0) + 1;
  const gaps = copyGaps(it);
  if (!gaps.length) return next;
  const r = await choiceDialog('有空出的件號', `<span class="code lg">${esc(itemCode(it))}-${gaps[0]}</span> 已空出，要補上嗎？`, [
    { value: gaps[0], label: `補上 ${itemCode(it)}-${gaps[0]}`, primary: true },
    { value: next, label: `用新號 ${itemCode(it)}-${next}` },
    ...(gaps.length > 1 ? [{ value: 'pick', label: `從 ${gaps.length} 個空號中挑選` }] : []),
  ]);
  if (r !== 'pick') return r;
  return choiceDialog('選擇空號', '', gaps.map(g => ({ value: g, label: `${itemCode(it)}-${g}` })));
}
async function editItemNo(it) {
  const w = workById(it.workId);
  const v = await promptDialog('修改款號', { value: String(it.no), label: `${w.code}-____`, type: 'text', inputmode: 'numeric', hint: '輸入數字，例如 12 代表 ' + `${w.code}-0012` });
  if (v == null) return;
  const n = parseInt(String(v).replace(/\D/g, ''), 10);
  if (!(n >= 1 && n <= 9999)) return toast('款號要是 1 到 9999 的數字');
  if (n === it.no) return;
  const other = S.items.find(x => x.workId === it.workId && x.no === n && x.id !== it.id);
  if (other) return toast(`${w.code}-${pad4(n)} 已經是「${other.name}」`);
  const from = itemCode(it), to = `${w.code}-${pad4(n)}`;
  if (!await doubleConfirm(`把「${esc(it.name)}」的編號從 <span class="code">${from}</span> 改成 <span class="code">${to}</span>？底下 ${it.copies.length} 件的編號也會一起改變。`,
    `確定修改嗎？盒子上如果已經貼了舊編號 ${from}，需要重貼標籤。`)) return;
  it.no = n; w.lastNo = Math.max(w.lastNo || 0, n); commit(); toast(`編號已改為 ${to}`);
}
async function editCopyN(it, c) {
  const v = await promptDialog('修改件號', { value: String(c.n), label: `${itemCode(it)}-__`, inputmode: 'numeric' });
  if (v == null) return false;
  const n = parseInt(String(v).replace(/\D/g, ''), 10);
  if (!(n >= 1 && n <= 999)) { toast('件號要是 1 到 999 的數字'); return false; }
  if (n === c.n) return false;
  if (it.copies.some(x => x.n === n && x.id !== c.id)) { toast(`${itemCode(it)}-${n} 已經存在`); return false; }
  if (!await doubleConfirm(`把 <span class="code">${copyCode(it, c)}</span> 改成 <span class="code">${itemCode(it)}-${n}</span>？`, '確定修改嗎？盒子上如果已經貼了舊編號，需要重貼標籤。')) return false;
  c.n = n; it.lastN = Math.max(it.lastN || 0, n); commit(); toast(`件號已改為 ${itemCode(it)}-${n}`);
  return true;
}

    ctx.$$('[data-editc]').forEach(b => b.onclick = () => openCopyForm(it.id, b.dataset.editc));
    ctx.$('[data-addc]').onclick = () => openCopyForm(it.id, null);
    ctx.$('[data-edit]').onclick = () => openItemForm({ item: it });
    ctx.$('[data-no]').onclick = () => editItemNo(it);
    ctx.$('[data-price]').onclick = () => openPriceLookup(it);
    ctx.$('[data-google]').onclick = () => googleSearch((it.barcodes || [])[0] || [w.id === W_OTH ? '' : w.zh, it.name].filter(Boolean).join(' '));
    ctx.$('[data-want]').onclick = () => openWantForm({ prefill: { workId: it.workId, typeId: it.typeId, brand: it.brand, name: '' } });
    ctx.$('[data-delete]').onclick = async () => {
      if (!await confirmDialog(`確定要把「${esc(it.name)}」（${esc(itemCode(it))}，${it.copies.length} 件）${esc(L('remove'))}嗎？資料和照片都會刪除，無法復原。<div class="hint" style="margin-top:8px">刪除後 ${esc(itemCode(it))} 這個編號會空出來，之後新增時會問你要不要補上。</div>`, { ok: '刪除', danger: true })) return;
      S.items = S.items.filter(x => x.id !== it.id);
      for (const ph of it.photos || []) if (!photoUsedElsewhere(ph.id, it.id)) await Photos.del(ph.id);
      commit(); await closeTop(); toast(`已${L('remove')}`);
    };
  };
  sheet({ title: '', full: true, onMount: render, refresh: render });
}
function photoUsedElsewhere(pid, exceptId) {
  return [...S.items, ...S.wants, ...S.drafts].some(x => x.id !== exceptId && (x.photos || []).some(p => p.id === pid));
}
function googleSearch(q) {
  q = String(q || '').trim();
  if (!q) return toast('沒有可以搜尋的條碼或名稱');
  window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank', 'noopener');
}

/* =========================================================
   每件明細（新增／編輯）

function selOptions(arr, sel, { none = '未填', label = x => x.name } = {}) {
  return `<option value="">${esc(none)}</option>` + arr.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(label(x))}</option>`).join('');
}
function placeOptions(sel) { return selOptions(S.places, sel, { none: '未指定', label: p => placeLabel(p.id) }); }
function sealChips(val) { return `<div class="chips" data-sealbox>${Object.entries(SEAL()).map(([k, n]) => `<button type="button" data-seal="${k}" class="${k === val ? 'on' : ''}">${esc(n)}</button>`).join('')}</div>`; }
function copyFieldsHTML(c, { withCount = false } = {}) {
  return `${withCount ? `<div class="field"><label>數量</label><div class="stepper"><button type="button" class="icon-btn" data-dec aria-label="減少">${ic('minus')}</button><input class="input grow" type="text" inputmode="numeric" value="${c.count || 1}" data-c="count"><button type="button" class="icon-btn" data-inc aria-label="增加">${ic('plus')}</button></div><div class="hint">同時買好幾件、狀態都一樣時用；每件會各自有件號。</div></div>` : ''}
    <div class="two"><div class="field"><label>購買日期${c.dateGuess ? '<span class="ai-mark">依照片日期推測</span>' : ''}</label><input class="input" type="date" value="${c.date || ''}" data-c="date"></div>
      <div class="field"><label>價格（台幣${withCount ? '，每件' : ''}）</label><input class="input" type="text" inputmode="numeric" value="${c.price ?? ''}" placeholder="0" data-c="price"></div></div>
    <div class="field"><label>購買管道</label><select class="input" data-c="channelId">${selOptions(S.channels, c.channelId)}</select></div>
    <div class="field"><div class="label">${L('sealState')}</div>${sealChips(c.seal || 'sealed')}</div>
    <div class="two"><div class="field"><label>${L('condition')}</label><select class="input" data-c="conditionId">${selOptions(S.conditions, c.conditionId)}</select></div>
      <div class="field"><label>${L('place')}</label><select class="input" data-c="placeId">${placeOptions(c.placeId)}</select></div></div>
    <div class="switch-row" style="border:0;padding-top:0"><div class="grow"><div>配件齊全</div><div class="small muted">說明書、配件、特典都在</div></div><label class="switch"><input type="checkbox" data-c="complete" ${c.complete !== false ? 'checked' : ''}><span></span></label></div>
    <div class="field"><label>這一件的備註</label><input class="input" value="${esc(c.note || '')}" placeholder="例如：盒角小壓痕" data-c="note"></div>`;
}
function bindCopyFields(ctx, c) {
  ctx.$$('[data-seal]').forEach(b => b.onclick = () => { c.seal = b.dataset.seal; ctx.$$('[data-seal]').forEach(x => x.classList.toggle('on', x === b)); });
  const cnt = ctx.$('[data-c="count"]');
  if (cnt) {
    ctx.$('[data-dec]').onclick = () => { cnt.value = Math.max(1, (parseInt(cnt.value, 10) || 1) - 1); };
    ctx.$('[data-inc]').onclick = () => { cnt.value = Math.min(99, (parseInt(cnt.value, 10) || 0) + 1); };
  }
}
function readCopyFields(ctx, c) {
  const v = k => ctx.$(`[data-c="${k}"]`);
  if (v('count')) c.count = Math.max(1, Math.min(99, parseInt(v('count').value, 10) || 1));
  c.date = v('date').value || '';
  if (c.dateGuess && c.date !== c.dateGuess) c.dateGuess = null;
  c.price = numOrNull(v('price').value);
  c.channelId = v('channelId').value; c.conditionId = v('conditionId').value; c.placeId = v('placeId').value;
  c.complete = v('complete').checked; c.note = v('note').value.trim();
  c.seal = c.seal || 'sealed';
}
const cleanCopy = (c, n) => ({ id: uid(), n, date: c.date || '', price: c.price, channelId: c.channelId || '', conditionId: c.conditionId || '', seal: c.seal || 'sealed', complete: c.complete !== false, placeId: c.placeId || '', note: c.note || '', createdAt: Date.now() });
function defaultCopy() {
  const lastC = S.items.flatMap(it => it.copies).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0];
  return { count: 1, date: todayISO(), price: null, channelId: '', conditionId: S.conditions[0]?.id || '', seal: 'sealed', complete: true, placeId: lastC?.placeId || S.places[0]?.id || '', note: '' };
}

function openCopyForm(itemId, copyId, { prefill = {}, onDone } = {}) {
  const it = itemById(itemId); if (!it) return;
  const orig = copyId ? it.copies.find(c => c.id === copyId) : null;
  const c = orig ? { ...orig } : { ...defaultCopy(), ...prefill };
  sheet({
    title: orig ? `編輯 ${copyCode(it, orig)}` : `${L('addCopy')}：${it.name}`,
    full: true,
    body: `${orig ? `<div class="card row"><span class="code lg">${esc(copyCode(it, orig))}</span><span class="grow"></span><button class="btn sm" data-n>${ic('edit')}改件號</button></div>` : `<div class="hint" style="margin:0 2px 10px">${esc(itemCode(it))} 目前有 ${it.copies.length} 件。</div>`}
      ${copyFieldsHTML(c, { withCount: !orig })}
      ${orig ? `<div class="hr"></div><button class="btn danger block" data-del>${ic('trash')}移出這一件</button>` : ''}`,
    foot: `<button class="btn" data-cancel>取消</button><button class="btn primary" data-save>${orig ? '儲存' : esc(L('addCopy'))}</button>`,
    onMount: ctx => {
      bindCopyFields(ctx, c);
      ctx.$('[data-cancel]').onclick = () => closeTop();
      const nb = ctx.$('[data-n]'); if (nb) nb.onclick = async () => { if (await editCopyN(it, orig)) ctx.setTitle(`編輯 ${copyCode(it, orig)}`), ctx.$('.code.lg').textContent = copyCode(it, orig); };
      const del = ctx.$('[data-del]');
      if (del) del.onclick = async () => {
        if (it.copies.length <= 1) return toast(`這是最後一件；要移出整款，請到下方「${L('remove')}」`);
        if (!await confirmDialog(`移出 <span class="code">${copyCode(it, orig)}</span>？這個件號會空出來。`, { ok: '移出', danger: true })) return;
        snapshot();
        it.copies = it.copies.filter(x => x.id !== orig.id);
        commit(); await closeTop(); toast(`已移出 ${copyCode(it, orig)}`, { label: '復原', fn: undo });
      };
      ctx.$('[data-save]').onclick = async () => {
        readCopyFields(ctx, c);
        if (orig) {
          Object.assign(orig, cleanCopy(c, orig.n), { id: orig.id, n: orig.n, createdAt: orig.createdAt });
          commit(); await closeTop(); toast('已儲存');
          return;
        }
        const first = await chooseCopyN(it);
        if (first == null) return;
        const made = [];
        let n = first;
        for (let i = 0; i < c.count; i++) {
          if (i > 0) n = Math.max(it.lastN || 0, ...it.copies.map(x => x.n)) + 1;
          const nc = cleanCopy(c, n); nc.createdAt = Date.now() + i;
          it.copies.push(nc); made.push(nc);
          it.lastN = Math.max(it.lastN || 0, n);
        }
        it.updatedAt = Date.now();
        onDone && await onDone(it);
        commit(); await closeTop();
        toast(`已${L('addCopy')} ${made.map(x => copyCode(it, x)).join('、')}`);
      };
    },
  });
}

/* =========================================================

const FIELD_LABEL = { name: '名稱', work: '作品', series: '系列', character: '角色', typeId: '類型', brand: '品牌', edition: '版本', barcodes: '條碼' };
function openItemForm({ item, prefill = {}, draftId = null, wantId = null, aiInfo = null } = {}) {
  const isNew = !item;
  const d = item ? JSON.parse(JSON.stringify(item)) : {
    id: uid(), name: '', workId: W_OTH, seriesId: '', character: '', typeId: '', brand: '', edition: '', barcodes: [], tags: [], note: '',
    estValue: null, origPrice: null, photos: [], mainPhoto: null, copies: [], lastN: 0, createdAt: Date.now(),
  };
  d.tagsText = (d.tags || []).join('、');
  d.pendingWork = null; d.pendingSeries = '';

  let linkWant = wantId || null, linkWantOn = true;
  const photoDraft = createPhotoDraft(d, prefill.photos || []);
  if (isNew) applyFields(d, prefill.fields || {}, false);
  if (aiInfo) { d.aiLoose = !!aiInfo.loose; }

  function applyFields(t, f, onlyEmpty = true) {
    const set = (k, v, mark = k) => { if (v == null || v === '' || (onlyEmpty && t[k])) return false; t[k] = v; if (f._ai) t.ai.add(mark); return true; };
    let n = 0;
    if (set('name', f.name)) n++;
    if (f.barcodes?.length) { for (const b of f.barcodes) if (!t.barcodes.includes(b)) { t.barcodes.push(b); n++; } }
    if (f.workId || f.workZh) {
      if (!onlyEmpty || t.workId === W_OTH && !t.pendingWork) {
        const ex = f.workId ? workById(f.workId) : findWork(f.workZh, f.workEn);
        if (ex) { t.workId = ex.id; t.pendingWork = null; } else { t.pendingWork = { zh: f.workZh, en: f.workEn || '' }; t.workId = '_pending'; }
        if (f._ai) t.ai.add('work'); n++;
      }
    }
    if (f.seriesName && (!onlyEmpty || (!t.seriesId && !t.pendingSeries))) {
      const ws = t.workId && t.workId !== '_pending' ? S.series.find(s => s.workId === t.workId && normName(s.name) === normName(f.seriesName)) : null;
      if (ws) { t.seriesId = ws.id; t.pendingSeries = ''; } else { t.pendingSeries = f.seriesName; t.seriesId = '_pending'; }
      if (f._ai) t.ai.add('series'); n++;
    }
    if (f.seriesId) { t.seriesId = f.seriesId; }
    if (set('character', f.character)) n++;
    if (f.typeName && (!onlyEmpty || !t.typeId)) { const ty = S.types.find(x => x.name === f.typeName); if (ty) { t.typeId = ty.id; if (f._ai) t.ai.add('typeId'); n++; } }
    if (f.typeId) t.typeId = f.typeId;
    if (set('brand', f.brand)) n++;
    if (set('edition', f.edition)) n++;
    return n;
  }

  const render = ctx => {
    const isAI = k => d.ai.has(k) ? `<span class="ai-mark">${d.aiLoose ? 'AI 推測' : 'AI'}</span>` : '';
    const w = d.workId === '_pending' ? null : workById(d.workId);
    const seriesList = w ? S.series.filter(s => s.workId === w.id) : [];
    const chars = [...new Set(S.items.filter(x => w && x.workId === w.id).map(x => x.character).filter(Boolean))];
    const brands = [...new Set([...S.items, ...S.wants].map(x => x.brand).filter(Boolean))];
    const dups = isNew ? findDuplicates(d) : [];
    const want = isNew ? (linkWant ? wantById(linkWant) : findWantMatch(d)) : null;
    if (want && !wantId) linkWant = want.id;
    ctx.setBody(`
      ${d.aiLoose ? `<div class="banner info">${ic('sparkle')}<div class="small">這是<b>沒有盒子的玩具</b>，AI 只能看外型推測，作品、系列、版本可能不準，請確認後再存。</div></div>` : ''}
      ${dups.map(x => `<div class="banner gold">${ic('alert')}<div class="grow small">${x.byCode ? '這個條碼已經在館藏' : '館藏可能已經有'}：<span class="code">${esc(itemCode(x.it))}</span> <b>${esc(x.it.name)}</b>（×${x.it.copies.length}）
        <div class="row" style="gap:6px;margin-top:8px"><button class="btn sm primary" data-dupadd="${x.it.id}">增加一件到這款</button><button class="btn sm" data-dupopen="${x.it.id}">看看</button></div><div class="hint">不是同一款就繼續填，當成新的一款。</div></div></div>`).join('')}
      ${want ? `<div class="banner info">${ic('heart')}<div class="grow small">${esc(L('wants'))}裡有「<b>${esc(want.name)}</b>」（${WANT_STATUS[want.status]}）。
        <label class="row" style="gap:8px;margin-top:6px"><input type="checkbox" data-linkwant ${linkWantOn ? 'checked' : ''} style="width:20px;height:20px">${esc(L('add'))}後從清單移除</label></div></div>` : ''}
      ${photoDraft.html()}
      <div class="field"><label>名稱${isAI('name')}</label><input class="input" data-f="name" value="${esc(d.name)}" placeholder="例如：RG 1/144 獨角獸鋼彈"></div>
      <div class="field"><label>作品${isAI('work')}</label><select class="input" data-f="workId">
        ${d.pendingWork ? `<option value="_pending" selected>新作品：${esc(d.pendingWork.zh)}${d.pendingWork.en ? `（${esc(d.pendingWork.en)}）` : ''}</option>` : ''}
        ${sortedWorks().map(x => `<option value="${x.id}" ${x.id === d.workId ? 'selected' : ''}>${esc(x.code)}　${esc(x.zh)}</option>`).join('')}
        <option value="_new">＋ 新作品…</option></select>
        ${d.pendingWork ? '<div class="hint">儲存時會幫這個新作品建立代號。</div>' : ''}</div>
      <div class="two"><div class="field"><label>系列${isAI('series')}</label><select class="input" data-f="seriesId">
        <option value="">未指定</option>
        ${d.pendingSeries ? `<option value="_pending" selected>新系列：${esc(d.pendingSeries)}</option>` : ''}
        ${seriesList.map(s => `<option value="${s.id}" ${s.id === d.seriesId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
        <option value="_new">＋ 新系列…</option></select></div>
        <div class="field"><label>角色${isAI('character')}</label><input class="input" data-f="character" value="${esc(d.character)}" list="charlist" placeholder="例如：獨角獸"><datalist id="charlist">${chars.map(x => `<option value="${esc(x)}">`).join('')}</datalist></div></div>
      <div class="two"><div class="field"><label>類型${isAI('typeId')}</label><select class="input" data-f="typeId">${selOptions(S.types, d.typeId)}</select></div>
        <div class="field"><label>品牌${isAI('brand')}</label><input class="input" data-f="brand" value="${esc(d.brand)}" list="brandlist" placeholder="例如：BANDAI"><datalist id="brandlist">${brands.map(x => `<option value="${esc(x)}">`).join('')}</datalist></div></div>
      <div class="field"><label>版本${isAI('edition')}</label><input class="input" data-f="edition" value="${esc(d.edition)}" placeholder="例如：一般版、限定版、特典、隱藏版"></div>
      ${isNew ? `<div class="section-title"><span>第一件的購買資料</span></div><div class="card">${copyFieldsHTML(copy, { withCount: true })}</div>` : ''}
      <div class="section-title"><span>條碼</span></div>
      <div class="card">
        ${(d.barcodes || []).map((b, i) => `<div class="row" style="margin-bottom:6px">${ic('barcode')}<span class="grow num">${esc(b)}</span><button type="button" class="icon-btn ghost" data-bc-del="${i}" aria-label="移除">${ic('x')}</button></div>`).join('') || '<div class="small muted" style="margin-bottom:8px">沒有條碼也可以；有條碼的話，逛店掃一下就知道買過沒。</div>'}
        <div class="row" style="gap:8px"><button type="button" class="btn sm grow" data-bc-scan>${ic('scan')}掃描</button><button type="button" class="btn sm grow" data-bc-type>${ic('keyboard')}手動輸入</button></div>
      </div>
      <div class="section-title"><span>其他</span></div>
      <div class="card">
        <div class="field"><label>標籤</label><input class="input" data-f="tagsText" value="${esc(d.tagsText)}" placeholder="用頓號或逗號分隔，例如：送禮、想出售"></div>
        <div class="two"><div class="field"><label>目前估價（每件）</label><input class="input" type="text" inputmode="numeric" data-f="estValue" value="${d.estValue ?? ''}" placeholder="選填"></div>
          <div class="field"><label>原始定價</label><input class="input" data-f="origPriceText" value="${esc(d.origPrice?.text || '')}" placeholder="例如 ¥1,650"></div></div>
        <div class="field" style="margin:0"><label>備註</label><textarea class="input" data-f="note" placeholder="選填">${esc(d.note)}</textarea></div>
      </div>
      ${!isNew ? `<div class="hint" style="margin:0 2px">典藏編號 ${esc(itemCode(item))}；要改編號請在詳情頁按「修改編號」。換作品時編號會跟著改。</div>` : ''}`);
    ctx.setFoot(`<button class="btn" data-cancel>取消</button><button class="btn primary" data-save>${isNew ? esc(L('add')) : '儲存'}</button>`);

      d.name = d.name.trim(); d.character = d.character.trim(); d.brand = d.brand.trim(); d.edition = d.edition.trim(); d.note = d.note.trim();
      if (isNew) readCopyFields(ctx, copy);
      const lw = ctx.$('[data-linkwant]'); if (lw) linkWantOn = lw.checked;

    photoDraft.bind(ctx, {
      getName: () => ctx.$('[data-f="name"]').value,

        toast(n ? `AI 填入 ${n} 個空白欄位，請確認` : 'AI 沒有可以補的空白欄位');

    if (isNew) bindCopyFields(ctx, copy);
    ctx.$$('[data-dupadd]').forEach(b => b.onclick = async () => {

      openCopyForm(target.id, null, {
        prefill: { ...copy, count: copy.count || 1 },
        onDone: async t => {
          if (extraPhotos.length && !(t.photos || []).length) { t.photos = extraPhotos; t.mainPhoto = extraPhotos[0].id; }
          for (const bc of d.barcodes) if (!t.barcodes.includes(bc) && !itemsByBarcode(bc).length) t.barcodes.push(bc);
          if (draftId) await removeDraft(draftId);
          for (const p of extraPhotos) if (!photoUsedElsewhere(p.id, null)) await Photos.del(p.id);
          if (linkWant && linkWantOn) removeWant(linkWant, t);

    const addCode = code => {

    ctx.$('[data-bc-scan]').onclick = () => { read(); openScanner({ capture: addCode }); };

    ctx.$('[data-cancel]').onclick = () => closeTop();

      read();

      // 作品

function toCanvas(src, sx = 0, sy = 0, sw, sh, maxSide = 4096) {
  const W = src.videoWidth || src.naturalWidth || src.width, H = src.videoHeight || src.naturalHeight || src.height;
  sw = sw ?? W; sh = sh ?? H;
  const k = Math.min(1, maxSide / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * k)); c.height = Math.max(1, Math.round(sh * k));
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
function thumbOf(canvas, size = 160) {
  const s = Math.min(canvas.width, canvas.height);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.drawImage(canvas, (canvas.width - s) / 2, (canvas.height - s) / 2, s, s, 0, 0, size, size);
  const d = c.toDataURL('image/jpeg', .72); c.width = c.height = 0;
  return d;
}
function makePhoto(canvas) {
  const full = toCanvas(canvas, 0, 0, undefined, undefined, 1200);
  const p = { id: uid(), thumb: thumbOf(canvas), full: full.toDataURL('image/jpeg', .82) };
  full.width = full.height = 0;
  return p;
}
async function fileToCanvas(file, max = 2000) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(file));
  const c = toCanvas(bmp, 0, 0, bmp.width, bmp.height, max);
  bmp.close?.();
  return c;
}
function dataToCanvas(src, max = 2000) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(toCanvas(im, 0, 0, im.naturalWidth, im.naturalHeight, max)); im.onerror = rej; im.src = src; });
}
async function photoCanvas(p) { const d = p.full || await Photos.get(p.id) || p.thumb; return dataToCanvas(d); }
function pickImageFiles(multiple = false) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = multiple;
    i.onchange = () => res([...i.files]);

// 讀照片的拍攝日期（EXIF DateTimeOriginal）；讀不到就回傳 null
async function readExifDate(file) {
  try {
    const buf = await file.slice(0, 256 * 1024).arrayBuffer();
    const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    let off = 2;
    while (off + 4 < v.byteLength) {
      const marker = v.getUint16(off); const len = v.getUint16(off + 2);
      if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) {
        const t = off + 10; const le = v.getUint16(t) === 0x4949;
        const u16 = o => v.getUint16(t + o, le), u32 = o => v.getUint32(t + o, le);
        const str = (o, n) => { let s = ''; for (let i = 0; i < n; i++) { const ch = v.getUint8(t + o + i); if (!ch) break; s += String.fromCharCode(ch); } return s; };
        const readIFD = o => { const n = u16(o); const tags = {}; for (let i = 0; i < n; i++) { const e = o + 2 + i * 12; tags[u16(e)] = { type: u16(e + 2), count: u32(e + 4), val: u32(e + 8) }; } return tags; };
        const ifd0 = readIFD(u32(4));
        let dt = null;
        if (ifd0[0x8769]) { const ex = readIFD(ifd0[0x8769].val); const tg = ex[0x9003] || ex[0x9004]; if (tg) dt = str(tg.val, 19); }
        if (!dt && ifd0[0x0132]) dt = str(ifd0[0x0132].val, 19);
        const m = /^(\d{4}):(\d{2}):(\d{2})/.exec(dt || '');
        if (!m || m[1] === '0000') return null;
        const iso = `${m[1]}-${m[2]}-${m[3]}`;
        return iso <= todayISO() && iso >= '1990-01-01' ? iso : null;
      }
      if ((marker & 0xFF00) !== 0xFF00) break;
      off += 2 + len;
    }
  } catch (e) { /* 沒有 EXIF */ }
  return null;
}

      } catch (e) { console.error(e); toast(e.zh || 'AI 辨識失敗'); }
      if (ai.isConnected) { ai.disabled = false; ai.innerHTML = `${ic('sparkle')}AI 辨識這些照片，補上空白欄位`; }
    };
  };
  function add(p) { list.push(p); if (!main) main = p.id; draw(); }
  async function store() { for (const p of list) if (p.full) { await Photos.put(p.id, p.full); delete p.full; } }
  return {
    html: () => `<div class="field"><div class="label">照片</div><div data-photos></div></div>`,
    bind(ctx, o = {}) { ctxRef = ctx; opts = o; draw(); },
    async commit(t) {
      await store();
      for (const id of removed) if (!photoUsedElsewhere(id, t.id)) await Photos.del(id);
      t.photos = list.map(p => ({ id: p.id, thumb: p.thumb }));
      t.mainPhoto = main;
    },
    async takeNew() { await store(); return list.map(p => ({ id: p.id, thumb: p.thumb })); },
  };
}

   相機
   ========================================================= */
const Cam = {
  stream: null,
  async start(video) {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('nocam');
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    video.srcObject = this.stream; video.setAttribute('playsinline', ''); video.muted = true;
    await video.play();
    const track = this.stream.getVideoTracks()[0];
    try { const caps = track.getCapabilities?.() || {}; if (caps.focusMode?.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
  },
  canTorch() { try { return !!this.stream?.getVideoTracks()[0].getCapabilities?.().torch; } catch (e) { return false; } },
  async torch(on) { try { await this.stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: on }] }); } catch (e) {} },
  stop(video) { this.stream?.getTracks().forEach(t => t.stop()); this.stream = null; if (video) { video.pause(); video.srcObject = null; } },
};
function camError(e) { return e.name === 'NotAllowedError' ? '沒有相機權限。請在 Chrome 網址列左側的設定中允許相機。' : '無法開啟相機。'; }
async function hiResSnapshot(video) {
  const vw = video.videoWidth, vh = video.videoHeight;
  try {
    const track = Cam.stream?.getVideoTracks()[0];
    if (track && 'ImageCapture' in window) {
      const blob = await Promise.race([new ImageCapture(track).takePhoto(), new Promise((_, r) => setTimeout(() => r(new Error('t')), 4000))]);
      const bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' });
      if (Math.abs(bmp.width / bmp.height - vw / vh) < .03 && bmp.width > vw) { const c = toCanvas(bmp, 0, 0, bmp.width, bmp.height, 2400); bmp.close?.(); return c; }
      bmp.close?.();
    }
  } catch (e) { /* fall back */ }
  return toCanvas(video, 0, 0, vw, vh, 2400);
}
function loadScript(src) {
  return new Promise((res, rej) => {
    if ([...document.scripts].some(s => s.src === src)) return res();
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = res; s.onerror = () => rej(new Error('load ' + src));
    document.head.appendChild(s);
  });
}
let barcodeDetector = null;
async function getDetector() {
  if (barcodeDetector) return barcodeDetector;
  if ('BarcodeDetector' in window) {
    try {
      const supported = await BarcodeDetector.getSupportedFormats();
      const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'code_93', 'itf', 'codabar', 'qr_code', 'data_matrix'].filter(f => supported.includes(f));
      if (want.length) { const d = new BarcodeDetector({ formats: want }); barcodeDetector = { detect: async src => { const r = await d.detect(src); return r[0]?.rawValue || null; } }; return barcodeDetector; }
    } catch (e) { console.warn(e); }
  }
  await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');
  const Z = window.ZXing;
  const hints = new Map(); hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  const cv = document.createElement('canvas');
  barcodeDetector = {
    detect: async video => {
      const w = video.videoWidth, h = video.videoHeight; if (!w) return null;
      const sc = Math.min(1, 1000 / w); cv.width = w * sc; cv.height = h * sc;
      cv.getContext('2d', { willReadFrequently: true }).drawImage(video, 0, 0, cv.width, cv.height);
      try { return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText(); }
      catch (e) { return null; } finally { reader.reset(); }
    },
  };
  return barcodeDetector;
}
async function detectBarcodesIn(canvas) {
  if (!('BarcodeDetector' in window)) return [];
  try {
    const sup = await BarcodeDetector.getSupportedFormats();
    const d = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'].filter(f => sup.includes(f)) });
    const r = await d.detect(canvas);
    const seen = new Set();
    return r.filter(x => x.rawValue && !seen.has(x.rawValue) && seen.add(x.rawValue)).map(x => ({
      code: x.rawValue,
      cx: (x.boundingBox.x + x.boundingBox.width / 2) / canvas.width * 1000,
      cy: (x.boundingBox.y + x.boundingBox.height / 2) / canvas.height * 1000,
    }));
  } catch (e) { return []; }
}

function openScanner({ capture, title = '掃描條碼', hint = '把條碼對準框內', extra = null } = {}) {
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `<div class="cam">
      <video muted playsinline></video>
      <div class="frame"><div class="laser"></div></div>
      <div class="cam-top"><button class="icon-btn" data-close aria-label="關閉">${ic('x')}</button><div class="grow"><b>${esc(title)}</b></div>
        <button class="icon-btn" data-torch aria-label="手電筒" hidden>${ic('flash')}</button></div>
      <div class="cam-bottom">
        <div class="cam-msg" data-msg>${esc(hint)}</div>
        <div class="row" style="gap:8px;margin-top:10px">
          <button class="btn ghost grow" data-type>${ic('keyboard')}手動輸入條碼</button>
          ${extra ? `<button class="btn ghost grow" data-extra>${ic('search')}${esc(extra.label)}</button>` : ''}
        </div>
      </div>
    </div>`;
  const video = $('video', el), msg = $('[data-msg]', el);
  let running = true, handled = false;
  const stop = () => { running = false; Cam.stop(video); };
  pushOverlay(el, { onClose: stop });
  $('[data-close]', el).onclick = () => closeTop();
  let torchOn = false;
  $('[data-torch]', el).onclick = async e => { torchOn = !torchOn; await Cam.torch(torchOn); e.currentTarget.classList.toggle('on', torchOn); };
  const finish = async code => {
    if (handled) return; handled = true;
    stop(); if (navigator.vibrate) navigator.vibrate(60);
    await closeTop(); capture(code);
  };
  $('[data-type]', el).onclick = async () => { const v = await promptDialog('輸入條碼', { inputmode: 'numeric', placeholder: '條碼下方的數字' }); if (v && v.trim()) finish(v.trim()); };
  const ex = $('[data-extra]', el); if (ex) ex.onclick = async () => { handled = true; stop(); await closeTop(); extra.fn(); };
  (async () => {
    try { await Cam.start(video); if (!running) return Cam.stop(video); if (Cam.canTorch()) $('[data-torch]', el).hidden = false; }
    catch (e) { console.warn(e); msg.textContent = camError(e) + '也可以改用手動輸入。'; $('.laser', el)?.remove(); return; }
    let det;
    try { det = await getDetector(); } catch (e) { msg.textContent = '這台手機無法辨識條碼（第一次使用需連網），請改用手動輸入。'; return; }
    let last = null, same = 0;
    const loop = async () => {
      if (!running) return;
      if (video.readyState >= 2) {
        try {
          const code = await det.detect(video);
          if (code) { if (code === last) same++; else { last = code; same = 1; } if (same >= 2 || /^\d{8}$|^\d{12,14}$/.test(code)) return finish(code); }
        } catch (e) {}
      }
      setTimeout(loop, 90);
    };
    loop();
  })();
}
