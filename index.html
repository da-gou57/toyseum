function openAICamera() {
  if (!navigator.onLine) return toast('AI 辨識需要連網');
  let two = true;
  const shots = [];
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `<div class="cam">
      <video muted playsinline></video>
      <div class="cam-top"><button class="icon-btn" data-close aria-label="關閉">${ic('x')}</button>
        <div class="grow"><div class="seg"><button data-n="2" class="on">正面＋背面</button><button data-n="1">只拍一張</button></div></div>
        <button class="icon-btn" data-torch aria-label="手電筒" hidden>${ic('flash')}</button></div>
      <div class="cam-bottom">
        <div class="cam-msg" data-msg></div>
        <div class="small" style="text-align:center;opacity:.8;margin-top:4px">照片會傳送給 Google 辨識・只拍玩具本身</div>
        <div class="row" style="justify-content:center;gap:18px;margin-top:6px">
          <button class="btn ghost sm" data-redo hidden style="width:92px">重拍</button>
          <button class="shutter" data-shot aria-label="拍照"></button>
          <span style="width:92px"></span>
        </div>
      </div>
    </div>`;
  const video = $('video', el), msg = $('[data-msg]', el), redo = $('[data-redo]', el);
  let running = true;
  const free = () => { shots.forEach(c => { c.width = c.height = 0; }); shots.length = 0; };
  pushOverlay(el, { onClose: () => { running = false; Cam.stop(video); } });
  const step = () => {
    $$('[data-n]', el).forEach(b => b.classList.toggle('on', (b.dataset.n === '2') === two));
    msg.innerHTML = !two ? '盒子正面朝上，<b>品名清楚入鏡</b>' : !shots.length ? '<b>第 1 張：盒子正面</b>，讓品名清楚入鏡' : '<b>第 2 張：盒子背面</b>（有條碼和說明文字的那面）';
    redo.hidden = !(two && shots.length);
  };
  $$('[data-n]', el).forEach(b => b.onclick = () => { two = b.dataset.n === '2'; free(); step(); });
  redo.onclick = () => { free(); step(); };
  $('[data-close]', el).onclick = () => closeTop();
  let torchOn = false;
  $('[data-torch]', el).onclick = async e => { torchOn = !torchOn; await Cam.torch(torchOn); e.currentTarget.classList.toggle('on', torchOn); };
  step();
  (async () => {
    try { await Cam.start(video); if (!running) return Cam.stop(video); if (Cam.canTorch()) $('[data-torch]', el).hidden = false; }
    catch (e) { msg.textContent = camError(e); }
  })();
  let busy = false;
  $('[data-shot]', el).onclick = async () => {
    if (!video.videoWidth || busy) return;
    busy = true;
    const c = await hiResSnapshot(video);
    busy = false;
    shots.push(c);
    if (navigator.vibrate) navigator.vibrate(30);
    if (two && shots.length === 1) { step(); return; }
    const imgs = [...shots]; shots.length = 0;
    await closeTop();
    runAISingle(imgs);
  };
}
async function albumSingle() {
  const files = (await pickImageFiles(true)).slice(0, 3);
  if (!files.length) return;
  const guess = await readExifDate(files[0]);
  const canvases = [];
  for (const f of files) { try { canvases.push(await fileToCanvas(f, 2400)); } catch (e) {} }
  if (!canvases.length) return toast('無法讀取照片');

    if (AI.key) toast('目前沒有網路，先手動填寫');

async function runAISingle(canvases, { guess = null } = {}) {

  const codesP = Promise.all(canvases.map(detectBarcodesIn));
  let r;
  try { r = await aiIdentifySingle(canvases); }
  catch (e) {
    if (!isOpen(ctx)) return;
    ctx.setTitle('辨識失敗');
    ctx.setBody(`<div class="banner">${ic('alert')}<div class="grow">${esc(e.zh || 'AI 發生錯誤')}</div></div><div class="small muted">照片還在，可以不用 AI、直接手動填寫。</div>`);
    ctx.setFoot(`<button class="btn" data-retry>再試一次</button><button class="btn primary" data-manual>手動填寫</button>`);
    ctx.$('[data-retry]').onclick = async () => { await closeTop(); runAISingle(canvases, { guess }); };
    ctx.$('[data-manual]').onclick = async () => {
      const codes = (await codesP).flat().map(x => x.code);
      const photos = canvases.map(c => makePhoto(c));

      openItemForm({ prefill: { photos, fields: { barcodes: [...new Set(codes)] }, copy: guess ? { date: guess, dateGuess: guess } : {} } });
    };
    return;
  }

  if (!isOpen(ctx)) return;
  const photos = [cropBox(canvases[0], r.box) || makePhoto(canvases[0]), ...canvases.slice(1).map(c => makePhoto(c))];
  canvases.forEach(c => { c.width = c.height = 0; });

function cropBox(canvas, box) {
  if (!Array.isArray(box) || box.length !== 4) return null;
  let [y0, x0, y1, x1] = box.map(Number);
  if (![y0, x0, y1, x1].every(isFinite) || y1 <= y0 || x1 <= x0) return null;
  if ((y1 - y0) * (x1 - x0) > 960000) return null; // 幾乎整張就不裁
  const W = canvas.width, H = canvas.height;
  const px = (x1 - x0) * .05, py = (y1 - y0) * .05;
  x0 = Math.max(0, x0 - px); x1 = Math.min(1000, x1 + px); y0 = Math.max(0, y0 - py); y1 = Math.min(1000, y1 + py);
  const c = toCanvas(canvas, x0 / 1000 * W, y0 / 1000 * H, (x1 - x0) / 1000 * W, (y1 - y0) / 1000 * H, 1400);
  const ph = makePhoto(c); c.width = c.height = 0;
  return ph;
}
function assignBarcodes(items, codes) {
  const pairs = [];
  for (const c of codes) items.forEach((it, i) => {
    const b = it.box; if (!Array.isArray(b) || b.length !== 4) return;
    const [y0, x0, y1, x1] = b;
    const inside = c.cx >= x0 && c.cx <= x1 && c.cy >= y0 && c.cy <= y1;
    pairs.push({ c, i, s: inside ? -1e9 + (x1 - x0) * (y1 - y0) : Math.hypot(c.cx - (x0 + x1) / 2, c.cy - (y0 + y1) / 2) });
  });
  pairs.sort((a, b) => a.s - b.s);
  const used = new Set(), done = new Set();
  for (const p of pairs) {
    if (used.has(p.c.code) || done.has(p.i) || p.s > 260) continue;
    items[p.i].barcodes = [p.c.code]; used.add(p.c.code); done.add(p.i);
  }
}

async function runMulti(srcs) {

  });

async function processPending(ids) {
  ids = ids.filter(id => S.drafts.some(d => d.id === id && d.ai === 'pending'));
  if (!ids.length) return openDrafts();
  if (!AI.key || !navigator.onLine) { toast(AI.key ? '目前沒有網路，先放在待整理' : '已放進待整理'); return openDrafts(); }
  let stopped = false;
  const ctx = sheet({ title: 'AI 辨識中', body: '', onClose: () => { stopped = true; } });
  const status = (n, msg = '') => ctx.setBody(`<div class="card row"><span class="spin"></span><div class="grow"><b>正在辨識 ${n} / ${ids.length} 張</b><div class="small muted">${msg || '照片已傳送給 Google，關掉這個畫面會停止，剩下的之後可以繼續'}</div></div></div>`);
  let done = 0, made = 0, err = null;
  for (let i = 0; i < ids.length && !stopped; i += 3) {
    const group = ids.slice(i, i + 3);
    status(done + 1);
    const canvases = [];
    for (const id of group) {
      const dr = S.drafts.find(d => d.id === id);
      const src = await SrcImgs.get(id) || (dr && await Photos.get(dr.mainPhoto));
      canvases.push(src ? await dataToCanvas(src, 2400).catch(() => null) : null);
    }
    const ok = canvases.map((c, k) => c ? k : -1).filter(k => k >= 0);
    let result;
    try { result = await aiIdentifyBatch(ok.map(k => canvases[k])); }
    catch (e) { err = e; canvases.forEach(c => c && (c.width = c.height = 0)); break; }
    for (let j = 0; j < ok.length; j++) {
      const k = ok[j], id = group[k], canvas = canvases[k];
      const dr = S.drafts.find(d => d.id === id); if (!dr) continue;
      const items = (result[j] || []).slice(0, 20);
      if (!items.length) { dr.ai = 'done'; dr.aiNote = 'AI 沒有找到玩具'; }
      else {
        const codes = await detectBarcodesIn(canvas);
        if (items.length === 1 && codes.length) items[0].barcodes = codes.map(c => c.code).slice(0, 1); else assignBarcodes(items, codes);
        const at = S.drafts.indexOf(dr);
        const news = items.map((it, m) => {
          const ph = items.length > 1 || it.box ? cropBox(canvas, it.box) : null;
          const nd = { id: uid(), photos: [], mainPhoto: null, fields: { ...it, _ai: true }, loose: it.loose, guessDate: dr.guessDate, ai: 'done', createdAt: dr.createdAt + m };
          if (ph) { nd._ph = ph; nd.photos = [{ id: ph.id, thumb: ph.thumb }]; nd.mainPhoto = ph.id; }
          else { nd.photos = [...dr.photos]; nd.mainPhoto = dr.mainPhoto; }
          return nd;
        });
        for (const nd of news) if (nd._ph) { await Photos.put(nd._ph.id, nd._ph.full); delete nd._ph; }
        S.drafts.splice(at, 1, ...news);
        if (news.every(nd => !nd.photos.some(p => p.id === dr.mainPhoto))) for (const p of dr.photos) await Photos.del(p.id);
        made += news.length;
      }
      await SrcImgs.del(id);
      canvas.width = canvas.height = 0;
      done++;
    }
    save();
  }
  commit();
  if (isOpen(ctx)) await closeTop();
  const left = S.drafts.filter(d => d.ai === 'pending').length;
  if (err) toast(err.code === 'quota' ? `免費額度暫時用完了，剩下 ${left} 張之後可以在待整理繼續` : `${err.zh || 'AI 發生錯誤'}，剩下 ${left} 張之後可以繼續`);
  else if (stopped) toast(`已停止，剩下 ${left} 張之後可以繼續`);
  else toast(`辨識完成，產生 ${made} 筆待整理`);
  openDrafts();
}

class AIError extends Error {

  get zh() {
    return ({
      nokey: '還沒有設定 AI 金鑰', offline: '目前沒有網路', timeout: 'AI 回應太久，請再試一次', network: '連不上 AI 服務',
      quota: '免費額度暫時用完了，請等一下再試', badkey: '金鑰無效，請到館務室檢查', model: '找不到可用的 AI 模型，請到館務室重新測試金鑰',
      parse: 'AI 的回應看不懂，請再試一次', bad: 'AI 拒絕了這個請求', http: 'AI 服務發生錯誤', nosearch: '這個金鑰目前不能使用 AI 上網搜尋',

const GEM = 'https://generativelanguage.googleapis.com/v1beta';
function parseLooseJSON(t) {
  t = String(t || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(t); } catch (e) {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw new AIError('parse');
}
async function geminiCall(parts, { model = AI.model, timeout = 60000, json = true, tools = null, raw = false } = {}) {
  if (!AI.key) throw new AIError('nokey');
  if (!navigator.onLine) throw new AIError('offline');
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), timeout);
  let res;
  try {
    res = await fetch(`${GEM}/models/${model || 'gemini-2.5-flash'}:generateContent`, {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': AI.key },
      body: JSON.stringify({ contents: [{ role: 'user', parts }], ...(tools ? { tools } : {}), generationConfig: { temperature: .2, ...(json && !tools ? { responseMimeType: 'application/json' } : {}) } }),
    });
  } catch (e) { throw new AIError(e.name === 'AbortError' ? 'timeout' : 'network'); } finally { clearTimeout(t); }
  if (res.status === 429) throw new AIError('quota');
  if (res.status === 404) throw new AIError('model');
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    const msg = j.error?.message || '';
    if (/api key|API_KEY|permission/i.test(msg) || res.status === 401 || res.status === 403) throw new AIError(tools && res.status === 403 ? 'nosearch' : 'badkey', msg);
    if (/quota|exhausted|limit/i.test(msg)) throw new AIError('quota', msg);
    if (tools && /search|tool|ground/i.test(msg)) throw new AIError('nosearch', msg);
    throw new AIError(res.status === 400 ? 'bad' : 'http', msg);
  }
  const j = await res.json();
  const cand = j.candidates?.[0];
  const text = (cand?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
  if (!text) throw new AIError('parse');
  const data = json ? parseLooseJSON(text) : text;
  return raw ? { data, grounding: cand?.groundingMetadata || null } : data;
}
const imgPart = canvas => ({ inline_data: { mime_type: 'image/jpeg', data: canvas.toDataURL('image/jpeg', .85).split(',')[1] } });
const aiImg = c => toCanvas(c, 0, 0, c.width, c.height, 1600);

const AI_ITEM_RULES = () => `- name：台灣常用的繁體中文名稱，保留系列、比例等規格，例如「RG 1/144 獨角獸鋼彈」「吉伊卡哇 大頭公仔 小八」。
- work_zh／work_en：作品（IP）的台灣常用中文名與官方英文名，例如 鋼彈／Gundam、變形金剛／Transformers、寶可夢／Pokémon、吉伊卡哇／Chiikawa。不屬於特定作品就給空字串。
- series：系列名稱，例如「HG」「Studio Series」「盲盒 第 3 彈」。
- character：角色名稱。
- brand：品牌或廠商，例如 BANDAI、TAKARA TOMY、POP MART、海洋堂。
- type：只能從這些選一個：${S.types.map(t => t.name).join('、')}
- edition：版本，例如 一般版、限定版、特典、隱藏版、會場限定；看不出來就給空字串。

{"name":"","work_zh":"","work_en":"","series":"","character":"","brand":"","type":"","edition":"","boxed":true,"confidence":"high|medium|low","box":[ymin,xmin,ymax,xmax]}
規則：
${AI_ITEM_RULES()}
- box：第 1 張照片中這件商品（含包裝）的範圍，座標是 0 到 1000 的整數。`;

async function aiIdentifyBatch(canvases) {

{"photos":[{"index":1,"items":[{"name":"","work_zh":"","work_en":"","series":"","character":"","brand":"","type":"","edition":"","boxed":true,"confidence":"high|medium|low","box":[ymin,xmin,ymax,xmax]}]}]}
規則：
- index 是照片順序（從 1 開始），每張照片都要列出；照片裡沒有玩具就給空的 items。
- 同一件玩具只列一次；不要列出背景、櫃子、手或其他非玩具物品。
${AI_ITEM_RULES()}
- box：這件玩具在該張照片中的範圍，座標是 0 到 1000 的整數。`;
  try {
    const r = await geminiCall([{ text: prompt }, ...small.map(imgPart)], { timeout: 120000 });

/* ---------- 金鑰設定 ---------- */
async function geminiModels() {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 15000);
  let res;
  try { res = await fetch(`${GEM}/models?pageSize=200`, { headers: { 'x-goog-api-key': AI.key }, signal: ctrl.signal }); }
  catch (e) { throw new AIError(e.name === 'AbortError' ? 'timeout' : 'network'); } finally { clearTimeout(t); }
  if (!res.ok) throw new AIError(res.status === 429 ? 'quota' : 'badkey');
  const j = await res.json();
  const ver = n => (n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] * 1 || 0;
  return (j.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace(/^models\//, ''))
    .filter(n => /^gemini-\d+(\.\d+)?-flash(-lite)?(-latest)?$/.test(n))
    .sort((a, b) => ver(b) - ver(a) || (a.includes('lite') - b.includes('lite')));
}
async function geminiSetup(onStatus) {
  onStatus('檢查金鑰…');
  const models = await geminiModels();
  if (!models.length) throw new AIError('model');
  let lastErr = null;
  for (const m of models.slice(0, 6)) {
    onStatus(`測試 ${m}…`);
    try {
      const r = await geminiCall([{ text: '只回傳 JSON：{"ok":true}' }], { model: m, timeout: 20000 });
      if (r && r.ok) { AI.model = m; await saveAI(); return { model: m }; }
    } catch (e) { lastErr = e; if (e.code === 'badkey') throw e; }
  }
  throw lastErr || new AIError('model');
}

const b64 = { enc: u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }, dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
function validState(d) { return d && Array.isArray(d.items) && Array.isArray(d.works) && d.settings; }
async function buildBackup(pw) {
  const payload = JSON.stringify({ state: S, photos: await Photos.all() });
  const head = { app: APP_ID, format: 1, version: APP_VERSION, exportedAt: new Date().toISOString() };
  if (!pw) return `{"app":"${APP_ID}","format":1,"version":${JSON.stringify(APP_VERSION)},"exportedAt":${JSON.stringify(head.exportedAt)},"encrypted":false,"data":${payload}}`;
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(payload)));
  return JSON.stringify({ ...head, encrypted: true, salt: b64.enc(salt), iv: b64.enc(iv), data: b64.enc(ct) });
}
function verNewer(a, b) { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; }
async function readBackup(text, askPw) {
  let obj; try { obj = JSON.parse(text); } catch (e) { throw new Error('這不是有效的備份檔'); }
  if (obj.app !== APP_ID) throw new Error(obj.app === 'home-pantry' ? '這是家庭庫存的備份檔，不能還原到 Toyseum' : '這不是 Toyseum 的備份檔');
  let data = obj.data;
  if (obj.encrypted) {
    const pw = await askPw(); if (pw == null) throw new Error('cancel');
    try {
      const key = await deriveKey(pw, b64.dec(obj.salt));
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(obj.iv) }, key, b64.dec(obj.data));
      data = JSON.parse(new TextDecoder().decode(pt));
    } catch (e) { throw new Error('密碼錯誤，無法解開備份'); }
  }

}

  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function migrate(d) {
  const base = defaultState();
  d.settings = { ...base.settings, ...(d.settings || {}) };
  for (const k of ['works', 'series', 'types', 'conditions', 'channels', 'places', 'items', 'wants', 'drafts']) if (!Array.isArray(d[k])) d[k] = base[k];
  if (!d.works.some(w => w.id === W_OTH)) d.works.unshift(base.works[0]);
  d.works.forEach(w => { w.lastNo = Math.max(w.lastNo || 0, ...d.items.filter(it => it.workId === w.id).map(it => it.no || 0)); });
  d.items.forEach(it => {
    it.copies = Array.isArray(it.copies) ? it.copies : [];
    it.barcodes = it.barcodes || []; it.tags = it.tags || []; it.photos = it.photos || [];
    if (!d.works.some(w => w.id === it.workId)) it.workId = W_OTH;
    it.lastN = Math.max(it.lastN || 0, ...it.copies.map(c => c.n || 0));
  });
  d.wants.forEach(w => { w.barcodes = w.barcodes || []; w.photos = w.photos || []; w.status = w.status || 'want'; });
  d.drafts.forEach(x => { x.photos = x.photos || []; x.fields = x.fields || {}; });
  d.schema = 1;
  return d;
}

  if (!S.settings.onboarded) openOnboarding();
  else if (S.settings.seenVersion !== APP_VERSION) openChangelog(true);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !overlays.length) renderMain(); });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('已下載新版本', { label: '重新載入', fn: () => location.reload() });
        });
      });
    } catch (e) { console.warn('sw', e); }
  }
}
boot();
</script>
</body>
</html>
